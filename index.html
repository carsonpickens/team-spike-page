<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Team schedule</title>
<!--
  The weekly schedule a Team Spike coach shares by link. This page holds no team data: it reads
  the week from the team-page function using the link's token (?t=...). Names are first name and
  last initial, and only if the coach allows them. Everything is drawn with textContent.
-->
<style>
  :root { --ground:#0A0A0A; --surface:#161616; --ink:#F5F5F5; --quiet:#9A9A9A; --line:#2A2A2A; --lane:#FF4D00; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font:16px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:20px 16px 48px; }
  .team { display:inline-block; background:var(--lane); color:#000; font-weight:800; letter-spacing:.04em;
          text-transform:uppercase; font-size:13px; padding:5px 14px; transform:skewX(-10deg); }
  h1 { font-size:34px; line-height:1.05; margin:14px 0 4px; font-style:italic; font-weight:900; text-transform:uppercase; }
  .nav { display:flex; gap:8px; align-items:center; margin:12px 0 20px; }
  .nav button { background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px;
                font:600 15px system-ui; padding:9px 14px; min-height:44px; }
  .nav button:disabled { opacity:.35; }
  .nav .sp { flex:1; }
  h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--quiet); margin:28px 0 10px; }
  .day { background:var(--surface); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .day h3 { margin:0 0 8px; font-size:17px; }
  .day.today h3::after { content:"TODAY"; margin-left:8px; font-size:11px; color:var(--lane); letter-spacing:.08em; }
  .w { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .w:first-of-type { border-top:0; padding-top:0; margin-top:0; }
  .w b { display:block; font-size:16px; }
  .w p { margin:4px 0 0; white-space:pre-wrap; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .tag { font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; border:1.5px solid; }
  .note { color:var(--quiet); font-size:14px; margin-top:4px; }
  .meet { color:var(--lane); font-weight:700; }
  .rest { color:var(--quiet); }
  .groups { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px; }
  .group { background:var(--surface); border-radius:14px; padding:14px 16px; border-left:5px solid; }
  .group b { font-size:16px; }
  .group small { color:var(--quiet); display:block; margin-top:2px; }
  .group ul { list-style:none; padding:0; margin:8px 0 0; }
  .tgt { margin-top:10px; background:#0F0F0F; border-radius:10px; padding:10px 12px; }
  .tgt .hd { color:var(--lane); font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  .tgt .row { display:flex; gap:10px; align-items:baseline; font-size:14px; padding:3px 0; }
  .tgt .row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tgt .row .pc { font:700 14px ui-monospace, SFMono-Regular, Menlo, monospace; white-space:nowrap; }
  .tgt .row .sub { color:var(--quiet); font-size:12px; white-space:nowrap; }
  .tgt .gh { color:var(--quiet); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin-top:8px; }
  .group .pace { color:var(--quiet); font-size:13px; margin-top:6px; }
  .group .pace b { color:var(--ink); font:700 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pick { position:sticky; top:0; z-index:5; background:var(--ground); margin:14px -16px 0; padding:10px 16px 12px;
          border-bottom:1px solid var(--line); }
  .pick .lbl { color:var(--quiet); font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }
  .chips { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; min-height:40px; padding:0 16px; border-radius:99px; border:2px solid var(--line); background:var(--surface);
          color:var(--ink); font:700 15px system-ui; white-space:nowrap; }
  .chip.on { color:#000; }
  .group.lead { margin-top:16px; }
  .msg { color:var(--quiet); padding:40px 0; text-align:center; }
  footer { color:var(--quiet); font-size:12px; margin-top:36px; text-align:center; }
</style>
</head>
<body>
<main id="app"><p class="msg">Loading…</p></main>
<script>
(function () {
  "use strict";
  var API = "https://lluwkizjktpnezxmcsys.supabase.co/functions/v1/team-page";
  var COLORS = { lane:"#FF4D00", amber:"#FFB000", green:"#39FF6A", blue:"#3DA5FF", purple:"#B77CFF", pink:"#FF5FA8", gray:"#9A9A9A" };
  var params = new URLSearchParams(location.search);
  var token = params.get("t") || "";
  var app = document.getElementById("app");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function parse(d) { var p = d.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(date) {
    var m = String(date.getMonth() + 1).padStart(2, "0"), d = String(date.getDate()).padStart(2, "0");
    return date.getFullYear() + "-" + m + "-" + d;
  }
  function addDays(d, n) { var x = parse(d); x.setDate(x.getDate() + n); return iso(x); }
  function fmt(d, opts) { return parse(d).toLocaleDateString(undefined, opts); }
  // ─── Daniels paces (the same formulas as the app's PaceMath) ───────────────────────────
  // A fitness score is the Daniels–Gilbert aerobic score. Paces are seconds per metre.
  var MILE = 1609.344;
  function vo2(v) { return -4.60 + 0.182258 * v + 0.000104 * v * v; }
  function frac(t) { return 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t); }
  function speedFor(target) { var a = 0.000104, b = 0.182258, c = -4.60 - target; return (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a); }
  function raceMinutes(meters, score) {
    var t = meters / speedFor(score * 0.9);
    for (var i = 0; i < 40; i++) {
      var f = score * frac(t) - vo2(meters / t), h = 1e-4;
      var d = ((score * frac(t + h) - vo2(meters / (t + h))) - f) / h;
      if (!d) break;
      var n = t - f / d;
      if (Math.abs(n - t) < 1e-7) { t = n; break; }
      t = Math.max(n, 0.5);
    }
    return t;
  }
  var ZONES = { E:"Easy", M:"Marathon", T:"Threshold", I:"Interval", R:"Repetition" };
  function zone(key, score) {
    var e = score < 39 ? score * 2 / 3 + 13 : score, th = score < 39 ? (e + score) / 2 : score;
    function at(share, s) { return 60 / speedFor(s * share); }
    function band(x) { return [x / 1.015, x / 0.985]; }
    var i = at(0.975, e);
    switch (key) {
      case "E": return [at(0.70, e), at(0.62, e)];
      case "M": return band(raceMinutes(42195, score) * 60 / 42195);
      case "T": return band(at(0.88, th));
      case "I": return band(i);
      case "R": return band(i - 6 / 400);
    }
    return null;
  }
  function clock(sec, tenths) {
    if (!isFinite(sec) || sec <= 0) return "–";
    if (tenths && sec < 60) return sec.toFixed(1);
    var w = Math.round(sec);
    return w >= 60 ? Math.floor(w / 60) + ":" + String(w % 60).padStart(2, "0") : String(w);
  }
  function range(z, meters, tenths) {
    var a = clock(z[0] * meters, tenths), b = clock(z[1] * meters, tenths);
    return a === b ? a : a + "–" + b;
  }
  function repLabel(m) { return m === 1600 ? "mile" : (m % 1000 === 0 ? (m / 1000) + "k" : m + "m"); }
  function repMeters(m) { return m === 1600 ? MILE : m; }
  function minutes(z, miles) {
    var a = Math.round(z[0] * miles * MILE / 60), b = Math.round(z[1] * miles * MILE / 60);
    return a === b ? a + " min" : a + "–" + b + " min";
  }
  function milesLabel(m) { return (Math.round(m) === m ? m : m.toFixed(1)) + " mi"; }
  function row(name, pace, sub) {
    var r = el("div", "row");
    r.appendChild(el("span", "nm", name));
    if (sub) r.appendChild(el("span", "sub", sub));
    r.appendChild(el("span", "pc", pace));
    return r;
  }

  // A workout's targets: easy-type runs at each group's midpoint pace; a workout at each
  // runner's own pace (or the group's, when the coach keeps runners' paces off the page).
  function targets(w, groupsById, only) {
    var miles = w.miles != null ? Number(w.miles) : null;
    if (!w.zone && !miles) return null;
    var perRunner = w.kind ? w.kind === "workout" : ["T", "I", "R"].indexOf(w.zone) >= 0;
    var meters = w.meters || 400;
    var box = el("div", "tgt");
    var head = [];
    if (miles) head.push(milesLabel(miles));
    if (w.zone) head.push(ZONES[w.zone] + " pace");
    if (w.zone && perRunner) head.push("per " + repLabel(meters));
    box.appendChild(el("div", "hd", head.join(" · ")));
    if (!w.zone) return box;
    var gs = (w.groups || []).map(function (wg) { return groupsById[wg.id]; })
      .filter(function (g) { return g && (!only || g.id === only); });
    gs.forEach(function (g) {
      var runners = perRunner ? (g.runners || []) : [];
      if (runners.length) {
        if (gs.length > 1) box.appendChild(el("div", "gh", g.name));
        runners.forEach(function (r) {
          var z = zone(w.zone, Number(r.s));
          if (z) box.appendChild(row(r.n, range(z, repMeters(meters), meters <= 300)));
        });
      } else if (g.mid != null) {
        var z = zone(w.zone, Number(g.mid));
        if (!z) return;
        if (perRunner) box.appendChild(row(g.name, range(z, repMeters(meters), meters <= 300), "per " + repLabel(meters)));
        else box.appendChild(row(g.name, range(z, MILE) + "/mi", miles ? "about " + minutes(z, miles) : null));
      }
    });
    return box;
  }

  function message(text) { app.textContent = ""; app.appendChild(el("p", "msg", text)); }

  function load(week) {
    if (!/^[A-Za-z0-9_-]{20,64}$/.test(token)) { message("This link isn't complete. Ask your coach for the page link."); return; }
    var url = API + "?t=" + encodeURIComponent(token) + (week ? "&week=" + week : "");
    fetch(url).then(function (r) {
      if (r.status === 404) throw new Error("This page isn't available. Your coach may have turned it off or made a new link.");
      if (!r.ok) throw new Error("The schedule couldn't be loaded. Try again in a minute.");
      return r.json();
    }).then(function (data) {
      render(data);
      var u = new URL(location.href);
      if (data.week === data.this_week) u.searchParams.delete("week"); else u.searchParams.set("week", data.week);
      history.replaceState(null, "", u);
    }).catch(function (e) { message(e.message); });
  }

  // Which training group this reader follows. The link's own ?g= wins; otherwise the last one
  // picked on this device for this team's link. A group that no longer exists falls back to all.
  var PICK_KEY = "ts.group." + token;
  var picked = params.get("g") || (function () { try { return localStorage.getItem(PICK_KEY) || ""; } catch (e) { return ""; } })();
  var lastData = null;
  function choose(id) {
    picked = id;
    try { if (id) localStorage.setItem(PICK_KEY, id); else localStorage.removeItem(PICK_KEY); } catch (e) {}
    var u = new URL(location.href);
    if (id) u.searchParams.set("g", id); else u.searchParams.delete("g");
    history.replaceState(null, "", u);
    if (lastData) render(lastData);
  }
  function groupCard(g, lead) {
    var card = el("div", "group" + (lead ? " lead" : ""));
    card.style.borderLeftColor = COLORS[g.color] || COLORS.gray;
    card.appendChild(el("b", null, g.name));
    card.appendChild(el("small", null, [g.guild, g.size + (g.size === 1 ? " athlete" : " athletes")].filter(Boolean).join(" · ")));
    if (g.mid != null) {
      var ez = zone("E", Number(g.mid));
      var p = el("div", "pace", "Easy runs ");
      p.appendChild(el("b", null, range(ez, MILE) + "/mi"));
      card.appendChild(p);
    }
    if ((g.athletes || []).length) {
      var ul = el("ul");
      g.athletes.forEach(function (n) { ul.appendChild(el("li", null, n)); });
      card.appendChild(ul);
    }
    return card;
  }

  function render(data) {
    lastData = data;
    app.textContent = "";
    document.title = data.team + " · schedule";
    var groupsById = {};
    (data.groups || []).forEach(function (g) { groupsById[g.id] = g; });
    var only = groupsById[picked] ? picked : "";
    var sel = only ? groupsById[only] : null;

    app.appendChild(el("span", "team", data.team));

    // The page leads with the training groups: pick one to see only its week.
    if ((data.groups || []).length > 1) {
      var pick = el("div", "pick");
      pick.appendChild(el("div", "lbl", "Training group"));
      var chips = el("div", "chips");
      var all = [{ id:"", name:"All groups", color:"gray" }].concat(data.groups);
      all.forEach(function (g) {
        var c = el("button", "chip" + (g.id === only ? " on" : ""), g.name);
        var col = g.id ? (COLORS[g.color] || COLORS.gray) : COLORS.lane;
        c.style.borderColor = col;
        if (g.id === only) c.style.background = col; else if (g.id) c.style.color = col;
        c.setAttribute("aria-pressed", g.id === only ? "true" : "false");
        c.onclick = function () { choose(g.id); };
        chips.appendChild(c);
        if (g.id === only) setTimeout(function () { c.scrollIntoView({ inline:"center", block:"nearest" }); }, 0);
      });
      pick.appendChild(chips);
      app.appendChild(pick);
    }
    app.appendChild(el("h1", null, "Week of " + fmt(data.week, { month:"long", day:"numeric" })));

    var nav = el("div", "nav");
    var prev = el("button", null, "‹ Previous");
    var next = el("button", null, "Next ›");
    var now = el("button", null, "This week");
    prev.disabled = data.week <= addDays(data.this_week, -14);
    next.disabled = data.week >= addDays(data.this_week, 42);
    now.disabled = data.week === data.this_week;
    prev.onclick = function () { load(addDays(data.week, -7)); };
    next.onclick = function () { load(addDays(data.week, 7)); };
    now.onclick = function () { load(null); };
    nav.appendChild(prev); nav.appendChild(el("span", "sp")); nav.appendChild(now); nav.appendChild(next);
    app.appendChild(nav);

    var today = iso(new Date());
    if (sel) app.appendChild(groupCard(sel, true));
    app.appendChild(el("h2", null, sel ? sel.name + " workouts" : "Workouts"));
    for (var i = 0; i < 7; i++) {
      var day = addDays(data.week, i);
      var box = el("section", "day" + (day === today ? " today" : ""));
      box.appendChild(el("h3", null, fmt(day, { weekday:"long", month:"short", day:"numeric" })));
      (data.meets || []).filter(function (m) { return m.day === day; }).forEach(function (m) {
        box.appendChild(el("div", "meet", "Meet: " + m.name + (m.location ? " · " + m.location : "")));
      });
      var ws = (data.workouts || []).filter(function (w) {
        return w.day === day && (!only || (w.groups || []).some(function (wg) { return wg.id === only; }));
      });
      ws.forEach(function (w) {
        var item = el("div", "w");
        item.appendChild(el("b", null, w.title));
        if (w.body) item.appendChild(el("p", null, w.body));
        var tags = el("div", "tags");
        if (!only) (w.groups || []).forEach(function (wg) {
          var g = groupsById[wg.id]; if (!g) return;
          var t = el("span", "tag", g.name);
          t.style.color = t.style.borderColor = COLORS[g.color] || COLORS.gray;
          tags.appendChild(t);
        });
        if (tags.childNodes.length) item.appendChild(tags);
        var t = targets(w, groupsById, only);
        if (t) item.appendChild(t);
        (w.groups || []).forEach(function (wg) {
          var g = groupsById[wg.id];
          if (g && wg.note && (!only || g.id === only)) item.appendChild(el("div", "note", only ? wg.note : g.name + ": " + wg.note));
        });
        box.appendChild(item);
      });
      if (!ws.length && !box.querySelector(".meet")) box.appendChild(el("div", "rest", "Nothing posted"));
      app.appendChild(box);
    }

    if (!sel && (data.groups || []).length) {
      app.appendChild(el("h2", null, "Training groups"));
      var grid = el("div", "groups");
      data.groups.forEach(function (g) { grid.appendChild(groupCard(g, false)); });
      app.appendChild(grid);
    }
    app.appendChild(el("footer", null, "Shared by your coaches with Team Spike."));
  }

  load(params.get("week"));
})();
</script>
</body>
</html>
